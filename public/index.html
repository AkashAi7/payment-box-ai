<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Box AI - Verified Action Sandboxes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .simulation-steps {
            margin-top: 20px;
        }

        .step {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .step-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .step-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
        }

        .step-title {
            font-weight: 600;
            color: #333;
        }

        .step-description {
            color: #666;
            margin-left: 44px;
        }

        .screenshot-preview {
            margin-top: 10px;
            margin-left: 44px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }

        .screenshot-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .action-summary {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .action-summary h3 {
            color: #856404;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .action-summary h3:before {
            content: '⚠️';
            margin-right: 10px;
            font-size: 24px;
        }

        .summary-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #ffeaa7;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: 600;
            color: #856404;
            width: 150px;
        }

        .summary-value {
            color: #333;
            flex: 1;
        }

        .biometric-auth {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }

        .biometric-auth h3 {
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .biometric-icon {
            font-size: 64px;
            margin: 20px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #ffc107;
            color: #856404;
        }

        .status-success {
            background: #28a745;
            color: white;
        }

        .status-error {
            background: #dc3545;
            color: white;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .alert-success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .risk-indicator {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .risk-low {
            background: #d4edda;
            color: #155724;
        }

        .risk-medium {
            background: #fff3cd;
            color: #856404;
        }

        .risk-high {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Payment Box AI</h1>
            <p>Verified Action Sandboxes for Trusted AI Shopping</p>
        </div>

        <div class="card">
            <h2>Create AI Action Request</h2>
            <form id="actionForm">
                <div class="form-group">
                    <label for="targetUrl">Target URL *</label>
                    <input 
                        type="url" 
                        id="targetUrl" 
                        placeholder="https://example.com/product"
                        value="https://www.example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input 
                        type="text" 
                        id="productName" 
                        placeholder="Product Name"
                        value="Example Product"
                    >
                </div>

                <div class="form-group">
                    <label for="price">Price</label>
                    <input 
                        type="text" 
                        id="price" 
                        placeholder="$99.99"
                        value="$99.99"
                    >
                </div>

                <div class="form-group">
                    <label for="productSelector">Product CSS Selector</label>
                    <input 
                        type="text" 
                        id="productSelector" 
                        placeholder=".product-item"
                        value=".product-item"
                    >
                </div>

                <div class="form-group">
                    <label for="actionButton">Action Button CSS Selector</label>
                    <input 
                        type="text" 
                        id="actionButton" 
                        placeholder=".buy-button"
                        value=".buy-button"
                    >
                </div>

                <button type="submit" class="button" id="submitBtn">
                    🚀 Verify Action in Sandbox
                </button>
            </form>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let currentSandboxId = null;
        let currentChallenge = null;

        document.getElementById('actionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Creating Sandbox...';

            const actionRequest = {
                action: 'purchase',
                targetUrl: document.getElementById('targetUrl').value,
                productName: document.getElementById('productName').value,
                price: document.getElementById('price').value,
                productSelector: document.getElementById('productSelector').value,
                actionButton: document.getElementById('actionButton').value,
            };

            try {
                await createAndVerifyAction(actionRequest);
            } catch (error) {
                showError(error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Verify Action in Sandbox';
            }
        });

        async function createAndVerifyAction(actionRequest) {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = '<div class="card loading"><div class="spinner"></div><p>Creating secure sandbox...</p></div>';

            // Step 1: Create sandbox
            const createResponse = await fetch(`${API_BASE}/sandbox/create`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(actionRequest),
            });

            const createData = await createResponse.json();
            
            if (!createData.success) {
                throw new Error(createData.error || 'Failed to create sandbox');
            }

            currentSandboxId = createData.sandboxId;

            // Step 2: Simulate action
            resultsContainer.innerHTML = '<div class="card loading"><div class="spinner"></div><p>Simulating action in sandbox...</p></div>';

            const simulateResponse = await fetch(`${API_BASE}/sandbox/${currentSandboxId}/simulate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
            });

            const simulateData = await simulateResponse.json();

            if (!simulateData.success) {
                throw new Error(simulateData.error || 'Failed to simulate action');
            }

            // Step 3: Display simulation results
            displaySimulationResults(simulateData);

            // Step 4: Create authentication challenge
            const challengeResponse = await fetch(`${API_BASE}/auth/challenge`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sandboxId: currentSandboxId }),
            });

            const challengeData = await challengeResponse.json();
            currentChallenge = challengeData.challenge;
        }

        function displaySimulationResults(data) {
            const html = `
                <div class="card">
                    <h2>🔍 Action Simulation Complete</h2>
                    
                    <div class="action-summary">
                        <h3>Review Action Details</h3>
                        <div class="summary-item">
                            <div class="summary-label">Action:</div>
                            <div class="summary-value">${data.actionSummary.action}</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">Product:</div>
                            <div class="summary-value">${data.actionSummary.product}</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">Price:</div>
                            <div class="summary-value">${data.actionSummary.price}</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">Vendor:</div>
                            <div class="summary-value">${data.actionSummary.vendor}</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-label">Risk Level:</div>
                            <div class="summary-value">
                                <span class="risk-indicator risk-${data.actionSummary.riskLevel}">
                                    ${data.actionSummary.riskLevel.toUpperCase()}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="simulation-steps">
                        <h3>Simulation Steps</h3>
                        ${data.steps.map(step => `
                            <div class="step">
                                <div class="step-header">
                                    <div class="step-number">${step.step}</div>
                                    <div class="step-title">${step.action}</div>
                                </div>
                                <div class="step-description">${step.description}</div>
                                ${step.screenshot ? `
                                    <div class="screenshot-preview">
                                        <img src="data:image/png;base64,${step.screenshot}" alt="Step ${step.step}">
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>

                    <div class="biometric-auth">
                        <h3>Biometric Verification Required</h3>
                        <div class="biometric-icon">🔐</div>
                        <p>Please confirm this action with your biometric authentication</p>
                        <button class="button" onclick="confirmWithBiometric()" style="max-width: 300px; margin: 20px auto 0;">
                            ✓ Confirm with Biometric
                        </button>
                        <button class="button" onclick="cancelAction()" 
                                style="max-width: 300px; margin: 10px auto 0; background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);">
                            ✗ Cancel Action
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('resultsContainer').innerHTML = html;
        }

        async function confirmWithBiometric() {
            const resultsContainer = document.getElementById('resultsContainer');
            
            try {
                // Simulate biometric authentication
                const authResponse = {
                    verified: true,
                    method: 'biometric',
                };

                // Execute action
                const executeResponse = await fetch(`${API_BASE}/sandbox/${currentSandboxId}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        challenge: currentChallenge,
                        authResponse,
                    }),
                });

                const executeData = await executeResponse.json();

                if (executeData.success) {
                    resultsContainer.innerHTML += `
                        <div class="card">
                            <div class="alert alert-success">
                                <h3>✅ Action Executed Successfully!</h3>
                                <p>Your purchase has been completed securely through the verified sandbox.</p>
                                <p><strong>Sandbox ID:</strong> ${executeData.sandboxId}</p>
                            </div>
                            ${executeData.screenshot ? `
                                <h4>Final Result:</h4>
                                <div class="screenshot-preview">
                                    <img src="data:image/png;base64,${executeData.screenshot}" alt="Final result">
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    showError(executeData.error || 'Failed to execute action');
                }
            } catch (error) {
                showError(error.message);
            }
        }

        async function cancelAction() {
            try {
                await fetch(`${API_BASE}/sandbox/${currentSandboxId}/cancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                });

                document.getElementById('resultsContainer').innerHTML = `
                    <div class="card">
                        <div class="alert alert-error">
                            <h3>❌ Action Cancelled</h3>
                            <p>The action has been cancelled. No changes were made.</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                showError(error.message);
            }
        }

        function showError(message) {
            const resultsContainer = document.getElementById('resultsContainer');
            resultsContainer.innerHTML = `
                <div class="card">
                    <div class="alert alert-error">
                        <h3>❌ Error</h3>
                        <p>${message}</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
